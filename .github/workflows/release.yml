name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          $native = "native_host"
          $tmp = Join-Path $env:TEMP "wv2"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json"
          $ver = @($index.versions | Where-Object { $_ -notmatch "-" })[-1]
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg"
          Invoke-WebRequest -Uri $url -OutFile "$tmp\wv2.zip" -UseBasicParsing
          Expand-Archive -Path "$tmp\wv2.zip" -DestinationPath $tmp -Force
          $lib = @("lib\net462", "lib\net45") | ForEach-Object { Join-Path $tmp $_ } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $lib) { throw "WebView2 package has no lib\net462 or lib\net45" }
          Copy-Item "$lib\*.dll" $native -Force
          $loader = Get-ChildItem $tmp -Recurse -Filter WebView2Loader.dll -File |
            Where-Object { $_.FullName -match "win-x64" } | Select-Object -First 1
          Copy-Item $loader.FullName $native -Force

      - name: Build native WebView2 host
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /out:native_host\LowPriceHunterHost.exe `
            /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            /r:native_host\Microsoft.Web.WebView2.Core.dll `
            /r:native_host\Microsoft.Web.WebView2.WinForms.dll `
            native_host\Host.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build executable (PyInstaller)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name LowPriceHunter --icon assets/logo.ico
          --add-data "ps5hunter/ui/index.html;ps5hunter/ui"
          --add-data "assets;assets"
          --add-data "native_host;native_host"
          --collect-all playwright
          start_ui.py

      - name: Smoke test (exe must start and serve UI)
        shell: pwsh
        run: ./smoke.ps1

      - name: Package (portable + update)
        shell: pwsh
        run: |
          # 用 tag 當版本號（v1.2.1 -> 1.2.1）
          $ver = "${{ github.ref_name }}".TrimStart("v", "V")
          ./package.ps1 -Version $ver
          Get-ChildItem dist\*.zip | Select-Object Name, Length

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $files = @(Get-ChildItem dist\LowPriceHunter-*-win64.zip, dist\LowPriceHunter-update.zip | Select-Object -ExpandProperty FullName)
          if ($files.Count -lt 2) {
            throw "缺少打包檔案：$($files -join ', ')"
          }
          Write-Host "準備發布 $tag，共 $($files.Count) 個檔案："
          $files | ForEach-Object { Write-Host "  - $_" }

          # 使用官方 gh CLI 原生串流上傳，避免第三方 Node action 在 Node 24 上傳大檔崩潰
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)

          if (-not $exists) {
            Write-Host "建立正式 Release $tag..."
            gh release create $tag --title $tag --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { throw "建立 Release $tag 失敗" }
          }

          foreach ($file in $files) {
            $ok = $false
            for ($try = 1; $try -le 3; $try++) {
              Write-Host "上傳 $(Split-Path -Leaf $file)（第 $try 次）..."
              gh release upload $tag $file --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds (5 * $try)
            }
            if (-not $ok) { throw "上傳 $file 失敗" }
          }

          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "設定 $tag 為 latest 失敗" }
          gh release view $tag --json tagName,isDraft,isPrerelease,assets --jq '{tag: .tagName, draft: .isDraft, pre: .isPrerelease, assets: [.assets[].name]}'
